<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedra, Papel ou Tesoura</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 420px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 20px;
      color: #333;
    }
    .botoes {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .painel {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 15px;
      text-align: left;
      font-size: 15px;
      line-height: 1.6;
      color: #475569;
    }
    .resultado {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      padding-top: 10px;
      border-top: 1px dashed #cbd5e1;
    }
    .vitoria { color: #16a34a; }
    .derrota { color: #dc2626; }
    .empate  { color: #ca8a04; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Pedra, Papel ou Tesoura</h1>
    
    <div class="botoes">
      <button onclick="jogar('pedra')">Pedra</button>
      <button onclick="jogar('papel')">Papel</button>
      <button onclick="jogar('tesoura')">Tesoura</button>
    </div>

    <div class="painel">
      <p><strong>A sua jogada:</strong> <span id="jogada-usuario">-</span></p>
      <p><strong>Computador:</strong> <span id="jogada-computador">-</span></p>
      <div id="resultado" class="resultado">Faça a sua escolha para jogar!</div>
    </div>
  </div>

  <script>
    function jogar(escolhaUsuario) {
      const aleatorio = Math.random();
      let escolhaComputador = "";

      if (aleatorio < 0.33) {
        escolhaComputador = "pedra";
      } else if (aleatorio <= 0.66) {
        escolhaComputador = "papel";
      } else {
        escolhaComputador = "tesoura";
      }

      let textoResultado = "";
      let classeCss = "";

      if (escolhaUsuario === escolhaComputador) {
        textoResultado = "Empate!";
        classeCss = "empate";
      } else if (
        (escolhaUsuario === "pedra" && escolhaComputador === "tesoura") ||
        (escolhaUsuario === "tesoura" && escolhaComputador === "papel") ||
        (escolhaUsuario === "papel" && escolhaComputador === "pedra")
      ) {
        let motivo = "";
        if (escolhaUsuario === "pedra") motivo = "Pedra quebra tesoura.";
        if (escolhaUsuario === "tesoura") motivo = "Tesoura corta papel.";
        if (escolhaUsuario === "papel") motivo = "Papel cobre a pedra.";

        textoResultado = `Ganhou! (${motivo})`;
        classeCss = "vitoria";
      } else {
        let motivo = "";
        if (escolhaComputador === "pedra") motivo = "Pedra quebra tesoura.";
        if (escolhaComputador === "tesoura") motivo = "Tesoura corta papel.";
        if (escolhaComputador === "papel") motivo = "Papel cobre a pedra.";

        textoResultado = `O computador venceu! (${motivo})`;
        classeCss = "derrota";
      }

      document.getElementById("jogada-usuario").textContent = escolhaUsuario.toUpperCase();
      document.getElementById("jogada-computador").textContent = escolhaComputador.toUpperCase();
      
      const elementoResultado = document.getElementById("resultado");
      elementoResultado.textContent = textoResultado;
      elementoResultado.className = "resultado " + classeCss;
    }
  </script>
</body>
</html>
